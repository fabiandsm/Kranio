name: CI - Validación DAGs Airflow

on:
  push:
    branches: ["main", "feature-*"]
  pull_request:
    branches: ["main"]

jobs:
  validate-dags:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # Checkout repo
      # -------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Python Setup
      # -------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -------------------------------------------------------
      # Cache pip (Acelera ejecuciones futuras)
      # -------------------------------------------------------
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # -------------------------------------------------------
      # Instalar Airflow (Necesario para el objeto DagBag)
      # -------------------------------------------------------
      - name: Install Apache Airflow
        run: |
          python -m pip install --upgrade pip
          
          # Usamos variables fijas para estabilidad
          AIRFLOW_VERSION=2.8.1
          PYTHON_VERSION=3.10
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"

      # -------------------------------------------------------
      # Dependencias opcionales (Ya no bloqueantes gracias al Mock)
      # -------------------------------------------------------
      - name: Install base dependencies (Optional)
        run: |
          pip install pandas numpy requests || echo "⚠️ Falló instalación de dependencias, pero el Mock salvará la validación."

      # -------------------------------------------------------
      # Configurar AIRFLOW_HOME
      # -------------------------------------------------------
      - name: Set AIRFLOW_HOME
        run: echo "AIRFLOW_HOME=${{ github.workspace }}/airflow" >> $GITHUB_ENV

      # -------------------------------------------------------
      # Crear estructura airflow y mover archivos (Preparación)
      # -------------------------------------------------------
      - name: Create airflow folders
        run: |
          mkdir -p $AIRFLOW_HOME/dags
          if [ -d automatizacion_pipeline ]; then
            cp automatizacion_pipeline/*.py $AIRFLOW_HOME/dags 2>/dev/null || true
            echo "✅ Archivos movidos a AIRFLOW_HOME/dags"
          else
            echo "⚠ La carpeta automatizacion_pipeline no se encontró (se usará ruta relativa)"
          fi

      # -------------------------------------------------------
      # 🚀 VALIDACIÓN DAGS (CORE FIX)
      # -------------------------------------------------------
      - name: Validate DAGs (Robust Mocking)
        run: |
          python - <<EOF
          import os
          import sys
          from unittest.mock import MagicMock

          # --- FIX: MOCKING DE DEPENDENCIAS ---
          # Simulamos librerías pesadas o externas para evitar ModuleNotFoundError.
          # Esto permite validar la estructura del DAG sin instalar todo el universo.
          
          MOCK_MODULES = [
              'pandas', 
              'numpy', 
              'requests', 
              'sklearn', 
              'pymongo', 
              'psycopg2', 
              'google.cloud', 
              'kubernetes'
          ]
          
          print("🛡️  Activando escudos (Mocks) para dependencias externas...")
          for mod in MOCK_MODULES:
              sys.modules[mod] = MagicMock()
              # Mockear submodulos comunes si es necesario
              sys.modules[f"{mod}.core"] = MagicMock()

          # Ahora sí importamos Airflow
          from airflow.models import DagBag

          # Definimos dónde buscar los DAGs (Priorizamos la carpeta original del repo)
          dag_folder = "${{ github.workspace }}/automatizacion_pipeline"
          
          print(f"🚀 Iniciando validación de DAGs en: {dag_folder}")

          if not os.path.exists(dag_folder):
              print(f"⚠ No se encontró la ruta {dag_folder}, buscando en AIRFLOW_HOME...")
              dag_folder = os.environ.get('AIRFLOW_HOME') + '/dags'

          # Carga de DAGs
          dagbag = DagBag(dag_folder=dag_folder, include_examples=False)

          # Reporte de Errores
          if dagbag.import_errors:
              print(f"\n❌ SE ENCONTRARON {len(dagbag.import_errors)} ERRORES CRÍTICOS:\n")
              for filename, stacktrace in dagbag.import_errors.items():
                  print(f"📄 Archivo: {filename}")
                  print(f"ea Error:\n{stacktrace}\n")
                  print("-" * 60)
              
              # Fallar el pipeline explícitamente
              sys.exit(1)

          # Éxito
          print("\n✅ DAGs cargados exitosamente (Sin errores de sintaxis/importación).")
          print(f"📊 Total DAGs detectados: {len(dagbag.dags)}")
          print("📋 Lista de DAG IDs:", list(dagbag.dags.keys()))
          
          EOF