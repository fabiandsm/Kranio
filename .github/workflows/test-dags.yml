name: CI - Validación DAGs Airflow

on:
  push:
    branches: ["main", "feature-*"]
  pull_request:
    branches: ["main"]

jobs:
  validate-dags:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # Checkout repo
      # -------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Python
      # -------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -------------------------------------------------------
      # Cache pip (acelera CI)
      # -------------------------------------------------------
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # -------------------------------------------------------
      # Instalar Airflow
      # -------------------------------------------------------
      - name: Install Apache Airflow
        run: |
          python -m pip install --upgrade pip

          AIRFLOW_VERSION=2.8.1
          PYTHON_VERSION=3.10
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"

          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"

      # -------------------------------------------------------
      # Dependencias base (seguras)
      # -------------------------------------------------------
      - name: Install base dependencies
        run: |
          pip install pandas numpy requests

      # -------------------------------------------------------
      # Requirements del proyecto si existen
      # -------------------------------------------------------
      - name: Install pipeline requirements if present
        run: |
          if [ -f automatizacion_pipeline/requirements.txt ]; then
            pip install -r automatizacion_pipeline/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements file found"
          fi

      # -------------------------------------------------------
      # Validación sintaxis Python
      # -------------------------------------------------------
      - name: Check Python syntax
        run: |
          if [ -d automatizacion_pipeline ]; then
            python -m compileall automatizacion_pipeline
          else
            echo "No pipeline folder found"
          fi

      # -------------------------------------------------------
      # Configurar AIRFLOW_HOME
      # -------------------------------------------------------
      - name: Set AIRFLOW_HOME
        run: echo "AIRFLOW_HOME=${{ github.workspace }}/airflow" >> $GITHUB_ENV

      # -------------------------------------------------------
      # Crear estructura airflow
      # -------------------------------------------------------
      - name: Create airflow folders
        run: |
          mkdir -p $AIRFLOW_HOME/dags

          if [ -d automatizacion_pipeline ]; then
            cp automatizacion_pipeline/*.py $AIRFLOW_HOME/dags 2>/dev/null || true
          else
            echo "automatizacion_pipeline folder not found"
          fi

      # -------------------------------------------------------
      # Validación DAGs
      # -------------------------------------------------------
      - name: Validate DAGs (import test)
        run: |
          python - <<EOF
          import os
          from airflow.models import DagBag

          dag_folder = "${{ github.workspace }}/automatizacion_pipeline"
          print(f"Validating DAGs in: {dag_folder}")

          if not os.path.exists(dag_folder):
              print("⚠ No DAG folder found. Skipping validation.")
              exit(0)

          dagbag = DagBag(
              dag_folder=dag_folder,
              include_examples=False,
          )

          if dagbag.import_errors:
              print("\n❌ DAG import errors:\n")
              for dag, err in dagbag.import_errors.items():
                  print(f"{dag}:\n{err}\n")
              raise SystemExit(1)

          print("\n✅ DAGs loaded successfully")
          print("Detected DAGs:", list(dagbag.dags.keys()))
          EOF
