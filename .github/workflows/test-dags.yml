name: CI - Validación DAGs Airflow

on:
  push:
    branches: [ "main", "feature-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-dags:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------
      # Checkout código
      # -----------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------------------
      # Python
      # -----------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -----------------------------------
      # Instalar Airflow
      # -----------------------------------
      - name: Install Apache Airflow
        run: |
          python -m pip install --upgrade pip
          AIRFLOW_VERSION=2.8.1
          PYTHON_VERSION=3.10
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"

      # -----------------------------------
      # Dependencias comunes de DAGs
      # Evita errores futuros
      # -----------------------------------
      - name: Install DAG common dependencies
        run: |
          pip install pandas numpy requests

      # -----------------------------------
      # Instalar requirements opcionales
      # (si existen en repo)
      # -----------------------------------
      - name: Install project requirements (optional)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # -----------------------------------
      # AIRFLOW_HOME
      # -----------------------------------
      - name: Set AIRFLOW_HOME
        run: echo "AIRFLOW_HOME=${{ github.workspace }}/airflow" >> $GITHUB_ENV

      # -----------------------------------
      # Crear carpetas airflow
      # -----------------------------------
      - name: Create airflow folders
        run: |
          mkdir -p $AIRFLOW_HOME/dags
          cp automatizacion_pipeline/*.py $AIRFLOW_HOME/dags || true

      # -----------------------------------
      # Validar DAGs
      # -----------------------------------
      - name: Validate DAGs (import test)
        run: |
          python - <<EOF
          from airflow.models import DagBag

          dagbag = DagBag(
              dag_folder="${{ github.workspace }}/automatizacion_pipeline",
              include_examples=False
          )

          if dagbag.import_errors:
              print("❌ Errores al importar DAGs:")
              for dag, err in dagbag.import_errors.items():
                  print(f"{dag}: {err}")
              raise SystemExit(1)

          print(f"✅ DAGs cargados correctamente: {len(dagbag.dags)}")
          EOF


